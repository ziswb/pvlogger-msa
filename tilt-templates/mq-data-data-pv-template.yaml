apiVersion: v1
kind: PersistentVolume
metadata:
  name: mq-data-data
  labels:
    type: local
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
    - ReadWriteOnce
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  hostPath:
    path: REPLACE_PATH/pv-data5
