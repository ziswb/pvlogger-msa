ktor {
  development = true
  deployment {
    port = 8083
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.dataaccessor.ApplicationKt.module]
  }
  server {
    isProd = true
  }
}

database {
  driverClass = "org.postgresql.Driver"
  dbServerUrl = "jdbc:postgresql://"${POSTGRESQL_HOST}":"${POSTGRESQL_PORT}"/"
  dbName = "pvdata"
  dbServerCanonicalUrl = "jdbc:postgresql://"${POSTGRESQL_HOST}":"${POSTGRESQL_PORT}"/pvdata?reWriteBatchedInserts=true"
  user = "postgres"
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}
