ktor {
  development = true
  deployment {
    port = 8083
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.dataaccessor.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.postgresql.Driver"
  dbServerUrl = "jdbc:postgresql://"${POSTGRESQL_HOST}":"${POSTGRESQL_PORT}"/"
  dbName = "pvdata"
  dbServerCanonicalUrl = "jdbc:postgresql://"${POSTGRESQL_HOST}":"${POSTGRESQL_PORT}"/pvdata?reWriteBatchedInserts=true"
  user = "postgres"
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}

messagequeue {
  clientId = "pvlogger-modbus-data-accessor"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://"${ACTIVEMQ_HOST}":"${ACTIVEMQ_PORT}"?jms.useAsyncSend=true"
}
