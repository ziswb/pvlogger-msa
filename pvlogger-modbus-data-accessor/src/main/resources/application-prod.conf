ktor {
  development = false
  deployment {
    port = 8083
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.dataaccessor.ApplicationKt.module]
  }
  server {
    isProd = true
  }
}

database {
  driverClass = "org.postgresql.Driver"
  dbServerUrl = "jdbc:postgresql://"${POSTGRESQL_HOST}":"${POSTGRESQL_PORT}"/"
  dbName = "pvdata"
  dbUrlParams = "?reWriteBatchedInserts=true"
  # TLS to PostgreSQL: "prefer" works with and without server TLS; the chart sets
  # POSTGRESQL_SSLMODE=require once the server has it (backlog 40, security finding 3).
  sslMode = "prefer"
  sslMode = ${?POSTGRESQL_SSLMODE}
  # Default for the shared central server; DB_USER selects an application role (backlog 40).
  user = "postgres"
  user = ${?DB_USER}
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}

# Dev only (ADR-0025): raw KPI rows take the client's dateCreated, for the
# history backfill. Never in production.
dev {
  acceptClientTimestamps = false
  acceptClientTimestamps = ${?DEV_ACCEPT_CLIENT_TIMESTAMPS}
}
