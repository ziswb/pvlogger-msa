ktor {
  development = true
  deployment {
    port = 8083
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.dataaccessor.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.h2.Driver"
  dbServerUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL"
  dbName = "pvdata"
  dbServerCanonicalUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL"
  user = "root"
  password = "password"
  maxPoolSize = 1
}
