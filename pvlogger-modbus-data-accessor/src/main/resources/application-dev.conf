ktor {
  development = true
  deployment {
    port = 8083
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.dataaccessor.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.postgresql.Driver"
  # Local development database: the pvlogger-database Docker Compose instance.
  dbServerUrl = "jdbc:postgresql://localhost:5432/"
  dbName = "pvdata"
  dbUrlParams = "?reWriteBatchedInserts=true"
  user = "postgres"
  password = ""
  password = ${?DB_PASSWORD}
  maxPoolSize = 1
}

# Dev only (ADR-0025): raw KPI rows take the client's dateCreated, so the
# history backfill works against a local run too. This profile never runs in
# an image.
dev {
  acceptClientTimestamps = true
}
