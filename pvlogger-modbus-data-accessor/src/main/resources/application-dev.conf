ktor {
  development = true
  deployment {
    port = 8083
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.dataaccessor.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.h2.Driver"
  dbServerUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=MYSQL"
  dbName = "pvdata"
  dbServerCanonicalUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=MYSQL"
  user = "root"
  password = "password"
  maxPoolSize = 1
}

messagequeue {
  clientId = "pvlogger-modbus-data-accessor"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
  ingress {
    queueName = "persist.modbus"
  }
}
