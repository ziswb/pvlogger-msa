version: '3.9'
# see https://activemq.apache.org/components/artemis/documentation/latest/docker.html for docker images
services:
  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: 'activemq'
    ports:
      - 61616:61616
      - 8161:8161
    volumes:
      - ~/activemq/data:/data/activemq
      - ~/activemq/log:/var/log/activemq
