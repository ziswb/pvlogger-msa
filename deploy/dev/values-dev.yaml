# Values for the local Tilt environment (backlog item 23). Not a production
# example: dummy credentials, no TLS to the database, the mock server as the
# Modbus device. Outside the chart directory, so it is never packaged.

secrets:
  postgresPassword: "dev-only-not-a-secret"

database:
  # The plain dev Postgres that Tilt deploys from deploy/dev/ (not part of the chart).
  host: "pvlogger-dev-postgres"
  sslmode: "disable"

modbus:
  host: "pvlogger-modbus-mock-server-service"

modbusMockServer:
  enabled: true

# Tilt builds the images locally; keep a locally built tag instead of pulling.
global:
  imagePullPolicy: IfNotPresent

# The SPA needs /v1/daydata and /livedata on its own origin: Rancher Desktop's
# Traefik (kube-system) serves the chart's allowlist on http://localhost/.
ingress:
  enabled: true
  traefik:
    enabled: true
    host: "localhost"
    tls: false
    namespace: "kube-system"

# global.timezone is set by the Tiltfile (the host's zone).
