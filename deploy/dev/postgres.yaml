# The plain PostgreSQL of the local Tilt environment (backlog item 23). Not part
# of the chart: production runs CloudNativePG (ADR-0023). No TLS, a dummy
# password (the same as secrets.postgresPassword in values-dev.yaml), data on a
# PVC so it survives pod restarts and tilt down/up; delete the PVC
# (data-pvlogger-dev-postgres-0) for a fresh database.
#
# The app role pvlogger is the superuser here, so the migrations that create
# or grant to other roles (V8, battery_sim_ro) run as they ran on the old
# central server. The Tiltfile replaces __NAMESPACE__ and __TIMEZONE__.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pvlogger-dev-postgres-init
  namespace: __NAMESPACE__
data:
  # pvdata comes from POSTGRES_DB. fsdata only matters with the FusionSolar
  # jobs, which need a real API account and stay off in Tilt.
  10-databases.sql: |
    CREATE DATABASE pvmasterdata;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pvlogger-dev-postgres
  namespace: __NAMESPACE__
  labels:
    app: pvlogger-dev-postgres
spec:
  serviceName: pvlogger-dev-postgres
  replicas: 1
  selector:
    matchLabels:
      app: pvlogger-dev-postgres
  template:
    metadata:
      labels:
        app: pvlogger-dev-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
          env:
            - name: POSTGRES_USER
              value: "pvlogger"
            - name: POSTGRES_PASSWORD
              value: "dev-only-not-a-secret"
            - name: POSTGRES_DB
              value: "pvdata"
            - name: TZ
              value: "__TIMEZONE__"
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pvlogger", "-d", "pvdata"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # PG 18+ keeps its data under /var/lib/postgresql/<major>/.
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: pvlogger-dev-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pvlogger-dev-postgres
  namespace: __NAMESPACE__
  labels:
    app: pvlogger-dev-postgres
spec:
  selector:
    app: pvlogger-dev-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
