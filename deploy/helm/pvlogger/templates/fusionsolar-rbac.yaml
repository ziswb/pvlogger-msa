{{- if .Values.fusionsolar.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fusionsolar-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-fusionsolar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fusionsolar-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-fusionsolar
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["fusionsolar-token-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fusionsolar-secret-reader-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-fusionsolar
subjects:
  - kind: ServiceAccount
    name: fusionsolar-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: fusionsolar-secret-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
{{- if .Values.fusionsolarAuth.enabled }}
# The token store. The chart creates it without data so the auth job needs no
# "create" on secrets (which cannot be limited to one name, and would let it
# mint a token Secret for any service account here; backlog 58). The job
# fills it; Helm never sets data, so upgrades leave the token alone, and
# "keep" leaves it in place when the release or the toggle goes.
# A secret the job created before this change must be adopted once
# (meta.helm.sh/release-name and -namespace annotations,
# app.kubernetes.io/managed-by=Helm label), or the upgrade refuses it.
apiVersion: v1
kind: Secret
metadata:
  name: fusionsolar-token-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-fusionsolar-auth
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fusionsolar-auth-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-fusionsolar-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fusionsolar-auth-secret-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-fusionsolar-auth
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["fusionsolar-token-secret"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fusionsolar-auth-secret-manager-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-fusionsolar-auth
subjects:
  - kind: ServiceAccount
    name: fusionsolar-auth-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: fusionsolar-auth-secret-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
