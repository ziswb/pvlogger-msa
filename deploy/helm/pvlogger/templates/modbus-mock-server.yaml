{{- if .Values.modbusMockServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvlogger-modbus-mock-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-modbus-mock-server
    {{- include "pvlogger.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  replicas: {{ .Values.modbusMockServer.replicas }}
  selector:
    matchLabels:
      app: pvlogger-modbus-mock-server
  template:
    metadata:
      name: pvlogger-modbus-mock-server
      labels:
        app: pvlogger-modbus-mock-server
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      containers:
        - name: pvlogger-modbus-mock-server
          image: {{ include "pvlogger.image" (dict "global" .Values.global "image" .Values.modbusMockServer.image) }}
          {{- include "pvlogger.goSecurityContext" (dict "uid" .Values.global.runAsUid) | nindent 10 }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            {{- include "pvlogger.timezoneEnv" . | nindent 12 }}
            - name: MOCK_PORT
              value: {{ .Values.modbusMockServer.containerPort | quote }}
            - name: DONGLE_DEVICE_ID
              value: {{ .Values.modbus.dongleDeviceId | quote }}
          ports:
            - containerPort: {{ .Values.modbusMockServer.containerPort }}
              name: tcp-modbus
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: tcp-modbus
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: tcp-modbus
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.modbusMockServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pvlogger-modbus-mock-server-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-modbus-mock-server
    {{- include "pvlogger.labels" . | nindent 4 }}
spec:
  selector:
    app: pvlogger-modbus-mock-server
  ports:
    - name: tcp-modbus
      port: {{ .Values.modbusMockServer.port }}
      targetPort: tcp-modbus
      protocol: TCP
{{- end }}
