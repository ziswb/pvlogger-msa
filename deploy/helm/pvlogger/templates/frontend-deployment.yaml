{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvlogger-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: pvlogger-frontend
    {{- include "pvlogger.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: pvlogger-frontend
  template:
    metadata:
      name: pvlogger-frontend
      labels:
        app: pvlogger-frontend
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      containers:
        - name: pvlogger-frontend
          image: {{ include "pvlogger.image" (dict "global" .Values.global "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "pvlogger.jvmSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
              name: tcp-frontend
              protocol: TCP
          env:
            {{- include "pvlogger.timezoneEnv" . | nindent 12 }}
            - name: DATA_ACCESSOR_HOST
              value: "pvlogger-modbus-data-accessor-service.{{ .Release.Namespace }}.svc.cluster.local"
            - name: DATA_ACCESSOR_PORT
              value: {{ .Values.dataAccessor.port | quote }}
          # Backlog 60: the startup probe covers the start (the database connect
          # retries for minutes before the server listens); after it, liveness
          # restarts a hung process and readiness drops the pod from the Service
          # while its dependencies fail.
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.frontend.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.frontend.port }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.frontend.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            {{- include "pvlogger.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "pvlogger.tmpVolume" . | nindent 8 }}
{{- end }}
