{{- if .Values.networkPolicies.enabled }}
# Default deny all ingress traffic to the release namespace.
# All ingress must be explicitly allowed by subsequent policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow all intra-namespace communication between pvlogger components.
# All pods in the release namespace are part of the same application
# and are trusted to communicate freely with each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Allow kubelet health probes (liveness/readiness) from cluster nodes.
# On K3S/Flannel, kubelet probes originate from the cni0 bridge IP (10.42.x.1)
# within the pod CIDR, not from the node's physical network IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - pvlogger-frontend
          - pvlogger-modbus-data-accessor
          - pvlogger-masterdata-server
          - pvlogger-kpi-exporter-serve
          - pvlogger-modbus-mock-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.kubeletCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
        - protocol: TCP
          port: {{ .Values.dataAccessor.port }}
        - protocol: TCP
          port: {{ .Values.masterdataServer.port }}
        {{- if .Values.kpiExportServe.enabled }}
        - protocol: TCP
          port: {{ .Values.kpiExportServe.port }}
        {{- end }}
        {{- if .Values.modbusMockServer.enabled }}
        - protocol: TCP
          port: {{ .Values.modbusMockServer.containerPort }}
        {{- end }}
---
# Allow Traefik ingress controller to reach the frontend and data accessor.
# Traefik terminates TLS and routes external traffic to these services.
{{- if .Values.ingress.traefik.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - pvlogger-frontend
          - pvlogger-modbus-data-accessor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.traefik.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
        - protocol: TCP
          port: {{ .Values.dataAccessor.port }}
{{- end }}
---
# Allow Tailscale ingress to reach the frontend and data accessor.
{{- if .Values.ingress.tailscale.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-tailscale
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - pvlogger-frontend
          - pvlogger-modbus-data-accessor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.tailscale.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
        - protocol: TCP
          port: {{ .Values.dataAccessor.port }}
{{- end }}
---
# The export endpoint's own Tailscale ingress (ADR-0021): the Tailscale
# namespace may reach the serve pod on its port, nothing else.
{{- if .Values.kpiExportServe.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-export-from-tailscale
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pvlogger-kpi-exporter-serve
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.tailscale.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.kpiExportServe.port }}
{{- end }}
{{- end }}
