apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvlogger.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | b64enc | quote }}
---
{{- if or .Values.fusionsolar.enabled .Values.fusionsolarAuth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: fusionsolar-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvlogger.labels" . | nindent 4 }}
type: Opaque
data:
  FUSIONSOLAR_PASSWORD: {{ required "secrets.fusionsolarPassword is required" .Values.secrets.fusionsolarPassword | b64enc | quote }}
{{- end }}
