# Every image builds from its Dockerfile (backlog 58). Code changes are built
# and tested by jvm.yml, go.yml and frontend.yml; this catches what only the
# image build exercises: the Dockerfile, the build context (.dockerignore) and
# the build stage's own steps (make prod). Nothing is pushed: release.yml
# publishes on a chart tag (ADR-0027). The Go images cross-compile for the
# target platform (backlog 56), so the runner builds working amd64 images.
name: Images

# Called by ci.yml when its paths changed (backlog 60); the path list lives there.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - pv-device-data-collector
          - pv-fast-data-collector
          - pv-full-data-collector
          - pvlogger-frontend
          - pvlogger-fusionsolar
          - pvlogger-fusionsolar-auth
          - pvlogger-kpi-exporter
          - pvlogger-masterdata-server
          - pvlogger-modbus-data-accessor
          - pvlogger-modbus-mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          MODULE: ${{ matrix.module }}
        run: docker build -f "$MODULE/docker/Dockerfile" -t "ci/$MODULE" .
