# Test and lint every Go module (services and the two libraries) through the
# top-level Makefile (backlog 53). No binaries: images are built from their own
# Dockerfiles, and `make build` would cross-compile each service twice
# (darwin + linux) for nothing.
name: Go

# Called by ci.yml when its paths changed (backlog 60); the path list lives there.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # fusionsolar's repository test runs its fsdata queries against this
    # (FSDATA_TEST_DSN; skipped without it). Same image tag as the JVM
    # Testcontainers tests (docs/UPGRADING.md, Test/dev DB row).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      # Keep in step with the local golangci-lint (docs/UPGRADING.md, Go toolchain row).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Test
        run: make test
        env:
          FSDATA_TEST_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      - name: Lint
        run: make lint
