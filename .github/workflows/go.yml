# Test and lint every Go module (services and the two libraries) through the
# top-level Makefile (backlog 53). No binaries: images are built from their own
# Dockerfiles, and `make build` would cross-compile each service twice
# (darwin + linux) for nothing.
name: Go

on:
  push:
    branches: [main]
    paths: &paths
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - "go.work.sum"
      - "**/Makefile"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
      # Read by the Go drift tests (paths_drift_test.go, masterdata_drift_test.go).
      - "pvlogger-shared-rest/src/main/kotlin/**/rest/*Paths.kt"
      - "pvlogger-masterdata-server/src/main/resources/db/migration/V2__DongleAggregateBlock.sql"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs only: every commit pushed to a branch gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      # Keep in step with the local golangci-lint (docs/UPGRADING.md, Go toolchain row).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Test
        run: make test
      - name: Lint
        run: make lint
