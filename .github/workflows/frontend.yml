# Angular SPA: unit tests (Vitest, jsdom) + production build, as in the image's web stage (backlog 53).
name: Frontend

on:
  push:
    branches: [main]
    paths: &paths
      - "pvlogger-frontend/src/web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs only: every commit pushed to a branch gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pvlogger-frontend/src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same major as the node:*-alpine build stage in pvlogger-frontend/docker/Dockerfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: pvlogger-frontend/src/web/package-lock.json
      - run: npm ci
      - run: npm run build:ci
