# Gradle build + tests of the Kotlin services and libraries (backlog 53).
# DB tests run against PostgreSQL via Testcontainers (ADR-0009); the runner has Docker.
# The Go modules have their own workflow, so the Gradle hook into make is skipped here.
name: JVM

on:
  push:
    branches: [main]
    paths: &paths
      - "**/*.kt"
      - "**/*.kts"
      - "**/src/main/resources/**"
      - "**/src/test/resources/**"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/jvm.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs only: every commit pushed to a branch gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew build -x makeGoBuild --stacktrace
