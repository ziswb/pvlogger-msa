# Weekly update PRs for the GitHub Actions pins (commit SHA + tag comment), all
# in one grouped PR (backlog 60). Gradle, Go, npm, the base images and the
# chart's third-party images come from Renovate (renovate.json5, ADR-0028),
# grouped per ecosystem as docs/UPGRADING.md asks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
