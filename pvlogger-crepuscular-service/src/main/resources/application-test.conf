ktor {
  development = true
  deployment {
    port = 8089
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.crepuscular.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.postgresql.Driver"
  dbServerUrl = "jdbc:postgresql://localhost:5432/"
  dbName = "pvdata"
  dbServerCanonicalUrl = "jdbc:postgresql://localhost:5432/pvdata?reWriteBatchedInserts=true"
  user = "postgres"
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}

sunset-sunrise-service {
  host = "api.sunrise-sunset.org"
  port = "443"
  path = "json"
  latitude = "<site-lat>"
  longitude = "<site-lon>"
}