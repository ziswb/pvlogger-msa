ktor {
  development = true
  deployment {
    port = 8089
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.crepuscular.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

messagequeue {
  clientId = "pvlogger-modbus-crepuscular"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
}

sunset-sunrise-service {
  host = "api.sunrise-sunset.org"
  port = "80"
  path = "json"
  latitude = "<site-lat>"
  longitude = "<site-lon>"
}