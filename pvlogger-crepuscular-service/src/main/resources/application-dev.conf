ktor {
  development = true
  deployment {
    port = 8089
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.crepuscular.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.h2.Driver"
  dbServerUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL"
  dbName = "pvdata"
  dbServerCanonicalUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL"
  user = "root"
  password = "password"
  maxPoolSize = 1
}

sunset-sunrise-service {
  host = "api.sunrise-sunset.org"
  port = "80"
  path = "json"
  latitude = "<site-lat>"
  longitude = "<site-lon>"
}