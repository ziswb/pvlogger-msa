post:
  tags:
    - StationRealKpi
  summary: Get the KPI for the given stations
  description: |
    This interface is used to obtain real-time plant data by plant ID set. Data of a maximum of 100 plants can be queried at a time.
    For details about the data list that can be queried using this interface, see 4.1 Real-Time Plant Data Interface.
  operationId: StationRealKpi
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../requestBodies/StationRealKpiRequest.yaml'
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '../responses/StationRealKpiResponse.yaml'
      description: OK
  security:
    - bearerAuth: [ ]
