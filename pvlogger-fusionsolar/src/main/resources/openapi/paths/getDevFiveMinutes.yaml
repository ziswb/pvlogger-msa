post:
  tags:
    - DeviceFiveMinutesData
  summary: Get the KPI for each device
  description: |
    This interface is used to obtain 5-minute device data. A maximum of 100 devices of the same type can be queried at a time.
    The backend calculates the date of the collection time based on the request parameter collectTime (collection time in milliseconds) and the time zone where the device is located.
    Then, you can query the 5-minute data of the device on the day based on the device ID.
    If there is data for n (0 ≤ n ≤ 288) 5 minutes of the day, n (0 ≤ n ≤ 288) records will be returned.
    For details about the data list that can be queried using this interface, see 4.7 5-minute Device Data Interface.
  operationId: DeviceFiveMinutesKpi
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../requestBodies/DevPeriodicDataRequest.yaml'
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '../responses/DevFiveMinutesResponse.yaml'
      description: OK
  security:
    - bearerAuth: [ ]
