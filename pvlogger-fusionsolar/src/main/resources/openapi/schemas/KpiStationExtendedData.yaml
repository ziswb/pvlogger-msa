type: object
required:
  - stationCode
  - collectTime
  - dataItemMap
properties:
  stationCode:
    type: string
  collectTime:
    type: integer
    format: int64
  dataItemMap:
    type: object
    properties:
      use_power:
        type: number
      radiation_intensity:
        type: number
      reduction_total_co2:
        type: number
      reduction_total_coal:
        type: number
      theory_power:
        type: number
      ongrid_power:
        type: number
      power_profit:
        type: number
      installed_capacity:
        type: number
      perpower_ratio:
        type: number
      inverter_power:
        type: number
      reduction_total_tree:
        type: number
      performance_ratio:
        type: number
