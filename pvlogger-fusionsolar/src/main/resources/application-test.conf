ktor {
  development = true
  deployment {
    port = 8090
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.fusionsolar.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.postgresql.Driver"
  dbServerUrl = "jdbc:postgresql://localhost:5432/"
  dbName = "fsdata"
  dbServerCanonicalUrl = "jdbc:postgresql://localhost:5432/fsdata?reWriteBatchedInserts=true"
  user = "postgres"
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}

messagequeue {
  clientId = "pvlogger-fusionsolar"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
}

fusionsolar {
  username = "<fusionsolar-user>"
  password = ${FUSIONSOLAR_PASSWORD}
  baseUrlOld = "https://eu5.fusionsolar.huawei.com/thirdData"
  baseUrlNew = "https://eu5.fusionsolar.huawei.com:27200/rest/openapi/pvms/v1"
}
