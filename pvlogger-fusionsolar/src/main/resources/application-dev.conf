ktor {
  development = true
  deployment {
    port = 8090
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.fusionsolar.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.h2.Driver"
  dbServerUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL"
  dbName = "fsdata"
  dbServerCanonicalUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL"
  user = "root"
  password = "password"
  maxPoolSize = 1
}

messagequeue {
  clientId = "pvlogger-fusionsolar"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
}

fusionsolar {
  username = "<fusionsolar-user>"
  password = ${FUSIONSOLAR_PASSWORD}
  baseUrlOld = "https://eu5.fusionsolar.huawei.com/thirdData"
  baseUrlNew = "https://eu5.fusionsolar.huawei.com:27200/rest/openapi/pvms/v1"
}
