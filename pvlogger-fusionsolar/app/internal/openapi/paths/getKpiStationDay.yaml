post:
  tags:
    - KpiStationDay
  summary: Get the KPI for the given stations
  description: |
    This interface is used to obtain daily plant data. Data of a maximum of 100 plants can be queried at a time.
    The backend calculates the month of the collection time based on the request parameter collectTime (collection time in milliseconds) and the time zone where the plant is located.
    Then, you can query the daily data of the plant by plant ID in the current month.
    If there is data for n (0 ≤ n ≤ 31) days of the month, n (0 ≤ n ≤ 31) records will be returned.
    For details about the data list that can be queried using this interface, see 4.3 Daily Plant Data Interface.
  operationId: KpiStationDay
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../requestBodies/KpiStationExtendedRequest.yaml'
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '../responses/KpiStationExtendedResponse.yaml'
      description: OK
  security:
    - bearerAuth: [ ]
