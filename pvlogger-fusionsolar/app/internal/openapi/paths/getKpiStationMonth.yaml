post:
  tags:
    - KpiStationMonth
  summary: Get the KPI for the given stations
  description: |
    This interface is used to obtain monthly plant data. Data of a maximum of 100 plants can be queried at a time.
    The backend calculates the year of the collection time based on the request parameter collectTime (collection time milliseconds) and the time zone where the plant is located.
    Then, you can query the monthly data of the plant by plant ID in the current year.
    If there is data for n (0 ≤ n ≤ 12) months of the year, n (0 ≤ n ≤ 12) records will be returned.
    For details about the data list that can be queried using this interface, see 4.4 Monthly Plant Data Interface.
  operationId: KpiStationMonth
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../requestBodies/KpiStationExtendedRequest.yaml'
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '../responses/KpiStationExtendedResponse.yaml'
      description: OK
  security:
    - bearerAuth: [ ]
