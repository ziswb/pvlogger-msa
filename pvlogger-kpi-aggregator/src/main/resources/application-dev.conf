ktor {
  development = true
  deployment {
    port = 8084
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.kpi.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

pvlogger {
  masterdata {
    host = "localhost"
    host = ${?MASTERDATA_HOST}
    port = "8081"
    port = ${?MASTERDATA_PORT}
  }
  dataaccessor {
    host = "localhost"
    host = ${?DATA_ACCESSOR_HOST}
    port = "8083"
    port = ${?DATA_ACCESSOR_PORT}
    meterDeviceIds = "1"
    inverterDeviceIds = "1,16"
  }
}
