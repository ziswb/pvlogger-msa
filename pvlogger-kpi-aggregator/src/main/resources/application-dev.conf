ktor {
  development = true
  deployment {
    port = 8084
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.kpi.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

pvlogger {
  masterdata {
    host = "localhost"
    host = ${?MASTERDATA_HOST}
    port = "8081"
    port = ${?MASTERDATA_PORT}
  }
}

messagequeue {
  clientId = "pvlogger-kpi-aggregator"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://"${ACTIVEMQ_HOST}":"${ACTIVEMQ_PORT}"?jms.useAsyncSend=true"
}
