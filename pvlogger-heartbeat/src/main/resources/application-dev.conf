ktor {
  development = true
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.heartbeat.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.h2.Driver"
  driverDelegateClass = "org.quartz.impl.jdbcjobstore.StdJDBCDelegate"
  dbServerUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL;"
  dbName = "mem"
  dbServerCanonicalUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=PostgreSQL;"
  user = "sa"
  password = ""
  maxPoolSize = 3
}

messagequeue {
  clientId = "pvlogger-modbus-heartbeat"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
}

job {
  lateEvening = "22:00"
}

crepuscular {
  host = ""
  port = 8089
}
