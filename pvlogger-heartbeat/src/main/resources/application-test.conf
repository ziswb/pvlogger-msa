ktor {
  development = true
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.heartbeat.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.postgresql.Driver"
  driverDelegateClass = "org.quartz.impl.jdbcjobstore.PostgreSQLDelegate"
  dbServerUrl = "jdbc:postgresql://localhost:5432/"
  dbSchema = "public"
  dbName = "heartbeat"
  dbServerCanonicalUrl = "jdbc:postgresql://localhost:5432/heartbeat?reWriteBatchedInserts=true"
  user = "postgres"
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}

messagequeue {
  clientId = "pvlogger-modbus-heartbeat"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
}

job {
  lateEvening = "22:00"
}

crepuscular {
  host = "localhost"
  host = ${?CREPUSCULAR_HOST}
  port = "8089"
  port = ${?CREPUSCULAR_PORT}
}
