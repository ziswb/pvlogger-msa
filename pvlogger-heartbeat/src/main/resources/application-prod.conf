ktor {
  development = true
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.heartbeat.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.postgresql.Driver"
  driverDelegateClass = "org.quartz.impl.jdbcjobstore.PostgreSQLDelegate"
  dbServerUrl = "jdbc:postgresql://"${POSTGRESQL_HOST}":"${POSTGRESQL_PORT}"/"
  dbName = "heartbeat"
  dbServerCanonicalUrl = "jdbc:postgresql://"${POSTGRESQL_HOST}":"${POSTGRESQL_PORT}"/heartbeat?reWriteBatchedInserts=true"
  user = "postgres"
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}

messagequeue {
  clientId = "pvlogger-modbus-heartbeat"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://"${ACTIVEMQ_HOST}":"${ACTIVEMQ_PORT}"?jms.useAsyncSend=true"
}

job {
  lateEvening = "22:00"
}