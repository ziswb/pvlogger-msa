ktor {
  development = true
  deployment {
    port = 8082
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.datacollector.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

pvlogger {
  masterdata {
    host = "localhost"
    port = "8081"
  }
}

messagequeue {
  clientId = "pvlogger-modbus-data-collector"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
}

huawei {
  modbus {
    tcp {
      host = "<dongle-ip>"
      port = 502
      delay = 1000
      meterDeviceIds = "1"
      inverterDeviceIds = "1,16"
    }
  }
}