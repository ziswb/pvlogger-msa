app {
  server {
    isProd = false
  }
}

pvlogger {
  masterdata {
    host = "localhost"
    host = ${?MASTERDATA_HOST}
    port = "8081"
    port = ${?MASTERDATA_PORT}
  }
}

messagequeue {
  clientId = "pvlogger-modbus-data-collector"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://"${ACTIVEMQ_HOST}":"${ACTIVEMQ_PORT}"?jms.useAsyncSend=true"
}

huawei {
  modbus {
    tcp {
      host = ${?LWIP_IP}
      port = ${?LWIP_PORT}
      delay = 1000
      meterDeviceIds = "1"
      inverterDeviceIds = "1,16"
    }
  }
}

