<app-datepicker></app-datepicker>
<div class="grid-container">
  <mat-grid-list cols="{{ ( cardLayout | async )?.columns }}" rowHeight="200px">
    <!-- KPI Values-->
    @for (mc of miniCardData; track mc; let last = $last) {
      <mat-grid-tile
        [colspan]="last ? ( cardLayout | async )?.lastMiniCard?.cols : ( cardLayout | async )?.miniCard?.cols"
        [rowspan]="( cardLayout | async )?.miniCard?.rows">
        <app-mini-card [title]="mc.title" [colorClass]="mc.colorClass" [kwFn]="mc.kwFn" [kWhFn]="mc.kWhFn"></app-mini-card>
      </mat-grid-tile>
    }
    <!-- Current KPIs (live power) -->
    <mat-grid-tile
      [colspan]="( cardLayout | async )?.table?.cols"
      [rowspan]="( cardLayout | async )?.table?.rows">
      <app-card title="Current KPIs">
        <app-kpichart></app-kpichart>
      </app-card>
    </mat-grid-tile>
    <!-- Daily energy KPIs (cumulative), as Grafana's "Today's KPIs so far" -->
    <mat-grid-tile
      [colspan]="( cardLayout | async )?.chart?.cols"
      [rowspan]="( cardLayout | async )?.chart?.rows">
      <app-card title="Daily KPIs so far">
        <app-daily-kpi-chart></app-daily-kpi-chart>
      </app-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
