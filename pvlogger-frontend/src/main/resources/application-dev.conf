ktor {
  development = true
  deployment {
    port = 8085
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.frontend.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

pvlogger {
  dataaccessor {
    host = "localhost"
    host = ${?DATA_ACCESSOR_HOST}
    port = "8083"
    port = ${?DATA_ACCESSOR_PORT}
  }
}

messagequeue {
  clientId = "pvlogger-frontend"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://"${ACTIVEMQ_HOST}":"${ACTIVEMQ_PORT}"?jms.useAsyncSend=true"
}
