ktor {
  development = true
  deployment {
    port = 8081
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.masterdata.server.ApplicationKt.module]
  }
  server {
    isProd = true
  }
}

database {
  driverClass = "org.postgresql.Driver"
  dbServerUrl = "jdbc:postgresql://postgres-service.postgresql.svc.cluster.local:5432/"
  dbName = "pvmasterdata"
  dbServerCanonicalUrl = "jdbc:postgresql://postgres-service.postgresql.svc.cluster.local:5432/pvmasterdata?reWriteBatchedInserts=true"
  user = "postgres"
  password = ${DB_PASSWORD}
  maxPoolSize = 3
}

masterdata {
  import {
    meterMasterDataPath = ${MASTER_DATA_PATH}/Sun2000-Meter-Register-Definitions.csv
    inverterMasterDataPath = ${MASTER_DATA_PATH}/Sun2000-Inverter-Register-Definitions.csv
    deviceIdentifiersMasterDataPath = ${MASTER_DATA_PATH}/Sun2000-DeviceIdentifiers-Definitions.csv
  }
}
