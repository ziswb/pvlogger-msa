ktor {
  development = true
  deployment {
    port = 8081
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.masterdata.server.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

database {
  driverClass = "org.h2.Driver"
  dbServerUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=MYSQL"
  dbName = "pvmasterdata"
  dbServerCanonicalUrl = "jdbc:h2:mem:mem;DATABASE_TO_UPPER=false;MODE=MYSQL"
  user = "root"
  password = ${DB_PASSWORD}
  maxPoolSize = 1
}

masterdata {
  import {
    meterMasterDataPath = ${HOME}/Documents/Solaranalage/Huawei/Masterdata/Modbus/Sun2000-Meter-Register-Definitions.csv
    inverterMasterDataPath = ${HOME}/Documents/Solaranalage/Huawei/Masterdata/Modbus/Sun2000-Inverter-Register-Definitions.csv
    deviceIdentifiersMasterDataPath = ${HOME}/Documents/Solaranalage/Huawei/Masterdata/Modbus/Sun2000-DeviceIdentifiers-Definitions.csv
  }
}
