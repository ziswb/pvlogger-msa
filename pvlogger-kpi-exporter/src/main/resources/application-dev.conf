ktor {
  development = true
  deployment {
    port = 8086
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.exporter.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

pvlogger {
  dataaccessor {
    host = "localhost"
    host = ${?DATA_ACCESSOR_HOST}
    port = "8083"
    port = ${?DATA_ACCESSOR_PORT}
  }
  export {
    path = ${HOME}
    root = "export"
    name = "pv_export_<site>"
  }
}

messagequeue {
  clientId = "pvlogger-kpi-exporter"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://localhost:61616?jms.useAsyncSend=true"
}
