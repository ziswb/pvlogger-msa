ktor {
  development = false
  deployment {
    port = 8086
    port = ${?PORT}
  }
  application {
    modules = [ch.bziswiler.pvlogger.exporter.ApplicationKt.module]
  }
  server {
    isProd = false
  }
}

pvlogger {
  dataaccessor {
    host = "pvlogger-modbus-data-accessor-service.pvlogger.svc.cluster.local"
    host = ${?DATA_ACCESSOR_HOST}
    port = "8083"
    port = ${?DATA_ACCESSOR_PORT}
  }
  export {
    path = "/pvlogger_export"
    root = "export"
    name = "pv_export_<site>"
  }
}

messagequeue {
  clientId = "pvlogger-kpi-exporter"
  user = "artemis"
  passwd = "artemis"
  brokerUrl = "tcp://"${ACTIVEMQ_HOST}":"${ACTIVEMQ_PORT}"?jms.useAsyncSend=true"
}
